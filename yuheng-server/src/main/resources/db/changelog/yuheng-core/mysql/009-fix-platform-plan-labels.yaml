      id: yuheng-mysql-009-fix-platform-plan-labels
      author: yuheng
      dbms: mysql
      preConditions:
        - onFail: HALT
        - onError: HALT
        - tableExists:
            tableName: infra_config
        - tableExists:
            tableName: infra_job
        - tableExists:
            tableName: system_dict_data
        - tableExists:
            tableName: system_dict_type
        - tableExists:
