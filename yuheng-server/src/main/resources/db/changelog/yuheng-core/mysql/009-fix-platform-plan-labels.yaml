# Version: 009; date: 2026-11-15; target: MySQL 8.x.
# Restore only 43 audited platform configuration/menu labels from the full source snapshot.
# Preserve executed 001-008 migrations, custom values, audit timestamps and user credentials.
# Historical notification messages intentionally remain unchanged.
# Rollback is guarded but cannot distinguish later edits equal to the corrected value;
# review and back up the matched rows before rollback in a real environment.
databaseChangeLog:
