$schema: https://json-schema.org/draft/2020-12/schema
title: Yuheng Manifest
type: object
required:
  - schemaVersion
  - project
  - codeVersion
  - artifacts
  - governanceVersion
  - knowledgeVersion
  - overlayVersion
  - compatibility
  - sourceCommit
  - generatedAt
properties:
  schemaVersion:
    type: integer
    minimum: 1
  project:
    type: object
    required: [id, kind]
    properties:
      id: {type: string, minLength: 1}
      kind: {type: string, enum: [framework, consumer]}
  codeVersion:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+'
  artifacts:
    type: object
    required: [server, ui]
    properties:
      server: {type: string, minLength: 1}
      ui: {type: string, minLength: 1}
  governanceVersion:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+'
  knowledgeVersion:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+'
  overlayVersion:
    type: string
    minLength: 1
  compatibility:
    type: object
    required: [code, governance, knowledge]
    properties:
      code: {type: string, minLength: 1}
      governance: {type: string, minLength: 1}
      knowledge: {type: string, minLength: 1}
  knowledgeTracks:
    type: array
    items: {type: string, minLength: 1}
  overlays:
    type: array
    items:
      type: object
      required: [id, path]
      properties:
        id: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
